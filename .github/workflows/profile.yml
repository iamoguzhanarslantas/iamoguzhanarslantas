name: Generate profile images

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches-ignore:
      - output

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Generate the snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0F766E&color_dots=#EBEDF0,#99F6E4,#2DD4BF,#14B8A6,#0F766E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5EEAD4&color_dots=#161B22,#134E4A,#0F766E,#14B8A6,#5EEAD4

      - name: Generate the 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Generate the trophy and streak cards
        run: python3 .github/scripts/profile_cards.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          TIMEZONE: Europe/Paris

      - name: Collect the images
        run: cp profile-3d-contrib/profile-night-teal.svg dist/

      - name: Publish the images to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

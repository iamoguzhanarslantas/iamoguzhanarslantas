name: Fetch Dash image (one-off)

on:
  push:
    branches:
      - claude/youthful-volta-ntzxey
    paths:
      - .github/workflows/fetch-dash.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download Dash
        run: |
          curl -sSfL -o assets/dash.png "https://emojis.slackmojis.com/emojis/images/1645198685/53297/dash-flutter.png?1645198685"
          file assets/dash.png

      - name: Commit Dash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dash.png
          git commit -m "Add Dash image"
          git push

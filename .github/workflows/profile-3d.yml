name: Generate 3D contributions

on:
  schedule:
    - cron: "43 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/profile-3d-settings.json
      - .github/workflows/profile-3d.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate the 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore: update 3D contribution graph"; then
            git push
          fi

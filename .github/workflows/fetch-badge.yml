name: Fetch Google Play badge (one-off)

on:
  push:
    branches:
      - claude/youthful-volta-ntzxey
    paths:
      - .github/workflows/fetch-badge.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download and trim the official badge
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          curl -sSfL -o /tmp/badge.png https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png
          /tmp/venv/bin/python - <<'PY'
          from PIL import Image
          image = Image.open("/tmp/badge.png").convert("RGBA")
          box = image.getchannel("A").getbbox()
          print("source size", image.size, "badge box", box)
          image.crop(box).save("assets/google-play-badge.png", optimize=True)
          print("trimmed size", image.crop(box).size)
          PY

      - name: Commit the trimmed badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/google-play-badge.png
          git commit -m "Add trimmed Google Play badge"
          git push
